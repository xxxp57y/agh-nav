<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agnes · 导航 Agent</title>
<style>
  :root{
    --bg:#0a0e13; --shell:#0f151c; --panel:#141c25; --panel2:#1a242f; --line:#22303d;
    --text:#e8eff7; --muted:#7f8fa1; --accent:#4c8dff; --accent2:#e85a14;
    --ok:#2ecc71; --warn:#f0a020; --err:#ef5350; --lm:#4c8dff;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);overflow:hidden;
       font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .app{display:grid;grid-template-rows:44px 1fr;height:100vh}

  /* ---------- 顶栏 ---------- */
  .top{display:flex;align-items:center;gap:11px;padding:0 14px;background:var(--shell);
       border-bottom:1px solid var(--line)}
  .brand{font-weight:650;display:flex;align-items:center;gap:8px;font-size:13px}
  .logo{width:17px;height:17px;border-radius:5px;background:linear-gradient(135deg,#4c8dff,#8b5cff)}
  .pills{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pill{padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:11px;white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:rgba(46,204,113,.45)}
  .pill.warn{color:var(--warn);border-color:rgba(240,160,32,.45)}
  .pill.info{color:var(--accent);border-color:rgba(76,141,255,.45)}

  /* ---------- 三栏 ---------- */
  .body{display:grid;grid-template-columns:246px minmax(0,1fr) minmax(420px,42%);min-height:0}
  @media(max-width:1250px){.body{grid-template-columns:210px minmax(0,1fr) minmax(340px,38%)}}

  /* 左：工作区 + 历史 */
  .side{background:var(--shell);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .side .hd{padding:10px 12px 6px;color:var(--muted);font-size:10.5px;letter-spacing:.7px;text-transform:uppercase}
  .wsbox{padding:0 10px 8px}
  .wsbox select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
               border-radius:7px;padding:6px 8px;font-size:12px;font-family:inherit}
  .newbtn{margin:0 10px 8px;width:calc(100% - 20px);background:var(--accent);border:none;color:#fff;
          border-radius:7px;padding:7px;font-size:12px;cursor:pointer;font-family:inherit}
  .newbtn:hover{background:#5f9bff}
  .threads{flex:1;overflow-y:auto;padding:0 8px 10px}
  .th{padding:7px 9px;border-radius:7px;cursor:pointer;margin-bottom:3px;border:1px solid transparent}
  .th:hover{background:var(--panel)}
  .th.active{background:rgba(76,141,255,.15);border-color:rgba(76,141,255,.4)}
  .th .t{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .th .m{font-size:10.5px;color:var(--muted);display:flex;gap:6px;margin-top:2px}
  .side .ft{padding:9px 12px;border-top:1px solid var(--line);color:var(--muted);font-size:10.5px}

  /* 中：对话 */
  .chat{display:flex;flex-direction:column;min-height:0;min-width:0}
  .log{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
  .msg{display:flex;gap:10px;max-width:min(760px,94%)}
  .av{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;
      justify-content:center;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
  .bub{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 12px;min-width:0;font-size:13px}
  .msg.user{margin-left:auto;flex-direction:row-reverse}
  .msg.user .bub{background:rgba(76,141,255,.13);border-color:rgba(76,141,255,.35)}
  .msg.err .bub{border-color:rgba(239,83,80,.5);color:#ffb9b7}
  .msg.sys .bub{background:transparent;border-style:dashed;color:var(--muted);font-size:12px}
  .tool{margin-top:7px;border-top:1px dashed var(--line);padding-top:6px;
        font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--muted);
        white-space:pre-wrap;word-break:break-word}
  .tool .nm{color:var(--accent)}
  .tool .er{color:var(--err)}
  .thinking{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:7px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  .composer{border-top:1px solid var(--line);background:var(--shell);padding:10px 14px;
            display:flex;gap:9px;align-items:flex-end}
  .composer textarea{flex:1;background:var(--panel2);color:var(--text);border:1px solid var(--line);
       border-radius:9px;padding:9px 11px;font-size:13px;font-family:inherit;resize:none;
       min-height:44px;max-height:150px}
  .composer button{background:var(--accent);border:none;color:#fff;border-radius:9px;padding:10px 16px;
       font-size:13px;cursor:pointer;font-family:inherit;flex:0 0 auto}
  .composer button:disabled{opacity:.5;cursor:default}
  .quick{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px;background:var(--shell)}
  .chip{padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
        font-size:11px;cursor:pointer;background:var(--panel)}
  .chip:hover{color:var(--text);border-color:var(--accent)}

  /* 右：可视化 */
  .viz{border-left:1px solid var(--line);background:var(--shell);display:flex;flex-direction:column;
       min-height:0;overflow-y:auto;padding:12px;gap:11px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;min-width:0}
  .card h3{margin:0 0 8px;font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.4px;
           display:flex;align-items:center;gap:7px}
  img{width:100%;display:block;border-radius:8px;background:#04070a}
  .mapwrap{position:relative;border-radius:8px;overflow:hidden;background:#04070a;line-height:0;
           cursor:zoom-in}
  .mapwrap:hover img{opacity:.94}
  .mapwrap svg{position:absolute;inset:0;width:100%;height:100%}
  .mapwrap img{max-height:340px;object-fit:contain}
  .kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 10px}
  .kv .k{color:var(--muted);font-size:11px;white-space:nowrap}
  .kv .v{font-variant-numeric:tabular-nums;text-align:right;font-size:12px;overflow:hidden;
         text-overflow:ellipsis;white-space:nowrap}
  .hint{color:var(--muted);font-size:11px;line-height:1.5}
  ul.ev{list-style:none;margin:0;padding:0;max-height:170px;overflow-y:auto}
  ul.ev li{display:flex;gap:7px;font-size:11px;padding:3px 7px;border-radius:5px;
           background:rgba(127,143,161,.09);margin-bottom:3px}
  .ek{color:var(--muted);flex:0 0 auto}.ed{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .callrow{font-size:11px;font-family:ui-monospace,Consolas,monospace;color:var(--muted);
           padding:3px 0;border-bottom:1px dotted var(--line);white-space:nowrap;overflow:hidden;
           text-overflow:ellipsis}
  .callrow .ok{color:var(--ok)}.callrow .no{color:var(--err)}
  code{background:rgba(127,143,161,.16);padding:1px 5px;border-radius:4px;font-size:11px}
  .empty{color:var(--muted);font-size:12px;padding:6px 0}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><span class="logo"></span>Agnes · 导航 Agent</div>
    <div class="pills">
      <span class="pill" id="pAgent">agent…</span>
      <span class="pill" id="pModel">—</span>
      <span class="pill" id="pScene">—</span>
      <span class="pill" id="pStep">—</span>
    </div>
  </div>

  <div class="body">
    <!-- ============ 左：工作区 / 历史 ============ -->
    <aside class="side">
      <div class="hd">工作区 <span style="text-transform:none;letter-spacing:0;color:#5b6a7d">（装对话的文件夹，目前只有一个）</span></div>
      <div class="wsbox"><select id="wsSel" title="工作区就是装对话的文件夹；当前只有 default 一个"></select></div>
      <button class="newbtn" id="btnNew">＋ 新对话</button>
      <div class="hd">历史对话 <span id="thCount" style="text-transform:none;letter-spacing:0"></span></div>
      <div class="threads" id="threads"></div>
      <div class="ft" id="sideFt">—</div>
    </aside>

    <!-- ============ 中：对话 ============ -->
    <section class="chat">
      <div class="log" id="log"></div>
      <div class="quick" id="quick"></div>
      <div class="composer">
        <textarea id="input" placeholder="说一句话让它做事，例如「带客人去客厅沙发」…（Ctrl+Enter 发送）"></textarea>
        <button id="send">发送</button>
      </div>
    </section>

    <!-- ============ 右：可视化 ============ -->
    <aside class="viz">
      <div class="card" style="padding:8px 11px">
        <div class="hint" style="display:flex;align-items:center;gap:7px">
          <span style="color:var(--muted)">可视化对象</span>
          <b id="vThread" style="color:var(--text);font-weight:600">—</b>
        </div>
      </div>
      <div class="card">
        <h3>第一人称画面 <span class="pill" id="vAge">—</span></h3>
        <img id="frame" alt="第一人称画面" />
      </div>
      <div class="card">
        <h3>楼层图 · 轨迹 · 地标 <span class="pill" id="vCal">—</span></h3>
        <div class="mapwrap">
          <img id="map" alt="楼层图" title="点一下看整张大图" />
          <svg id="ov" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div class="hint" style="margin-top:6px">
          <span style="color:#8fbaff">■</span> 地名册　
          <span style="color:#e85a14">━</span> 走过　
          <span style="color:#22c55e">●</span> 终点　
          <span style="color:#f0780a">●</span> 机器人　
          <span style="color:#f0a020">◇</span> 当前目标
        </div>
      </div>
      <div class="card">
        <h3>机器人状态</h3>
        <div class="kv" id="tele"></div>
      </div>
      <div class="card">
        <h3>这一步模型调了什么 <span class="pill" id="vCalls">0</span></h3>
        <div id="calls"><div class="empty">还没调用过工具。</div></div>
      </div>
      <div class="card">
        <h3>事件流</h3>
        <ul class="ev" id="ev"><li><span class="ek">—</span><span class="ed">等待中</span></li></ul>
      </div>
    </aside>
  </div>
</div>

<script>
const AGENT = '__AGENT_BASE__';
const NAVLIVE = '__NAVLIVE_BASE__';
const $ = (id) => document.getElementById(id);

let workspace = 'default';
let threadId = null;
/** 当前对话线对应的仿真会话。右侧可视化**永远读它**，不是"服务端当前会话"。
 *  这是"换对话后可视化不变/显示别人的场景"的根治点。 */
let viewSession = null;
let lastSeq = 0;
let busy = false;

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d=2) => (v===null||v===undefined||Number.isNaN(Number(v))) ? '—' : Number(v).toFixed(d);

async function api(path, opts) {
  const res = await fetch(AGENT + path, Object.assign({cache:'no-store'}, opts || {}));
  const text = await res.text();
  let body; try { body = JSON.parse(text) } catch { body = { raw: text } }
  if (!res.ok) throw new Error(body.error || body.detail || ('HTTP ' + res.status));
  return body;
}

/* ---------------- 左侧：工作区与历史 ---------------- */
async function loadWorkspaces() {
  const { workspaces } = await api('/api/workspaces');
  // 只显示工作区名 —— 之前把"对话条数"塞进选项里，看着莫名其妙。
  // 对话条数已经在下面的「历史对话 (n)」里显示了。
  $('wsSel').innerHTML = workspaces.map((w) =>
    `<option value="${esc(w.workspace)}">${esc(w.title || w.workspace)}</option>`).join('');
  workspace = workspaces[0]?.workspace || 'default';
  $('wsSel').onchange = (e) => { workspace = e.target.value; threadId = null; viewSession = null; loadThreads(); };
}

async function loadThreads() {
  const { threads } = await api('/api/threads?workspace=' + encodeURIComponent(workspace));
  if (!threads.length) {
    $('threads').innerHTML = '<div class="empty" style="padding:8px">还没有对话，点上面「新对话」开始。</div>';
  } else {
    $('threads').innerHTML = threads.map((t) => `
      <div class="th${t.thread_id === threadId ? ' active' : ''}" data-id="${esc(t.thread_id)}">
        <div class="t">${esc(t.title || '新对话')}</div>
        <div class="m"><span>${t.message_count} 条</span>${t.scene_id ? `<span>· ${esc(t.scene_id)}</span>` : ''}</div>
      </div>`).join('');
    [...$('threads').querySelectorAll('.th')].forEach((el) => {
      el.onclick = () => openThread(el.dataset.id);
    });
  }
  $('sideFt').textContent = `工作区 ${workspace} · ${threads.length} 条对话`;
  $('thCount').textContent = threads.length ? `（${threads.length}）` : '';
}

/** 新建对话：**不动**可视化 —— 新对话还没有场景，右侧显示"未开场景"。
 *  只有在那条对话里真的派活/开场景之后，它才拥有自己的会话。 */
async function newThread() {
  const t = await api('/api/threads', { method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ workspace }) });
  threadId = t.thread_id;
  viewSession = null;
  lastSeq = 0;
  $('log').innerHTML = ''; $('ev').innerHTML = ''; renderCalls([], false);
  $('vThread').textContent = '新对话 · 未开场景';
  sysNote('新对话。说一句话让它做事，例如「带客人去厨房」。\n这个对话会独立开自己的场景会话，和别的对话互不干扰。');
  await loadThreads();
}

async function openThread(id) {
  threadId = id;
  const thread = await api('/api/thread?workspace=' + encodeURIComponent(workspace) + '&thread_id=' + encodeURIComponent(id));
  // 关键：把可视化切到**这条对话自己的会话**。没有就让右侧显示"这个对话还没开场景"。
  viewSession = (thread.context || {}).session_id || null;
  lastSeq = 0;
  $('ev').innerHTML = '';
  $('log').innerHTML = '';
  // 把右侧"这个对话"的状态标清楚
  const sc = (thread.context || {}).scene_id;
  $('vThread').textContent = (thread.title || '对话') + (sc ? ' · ' + sc : ' · 未开场景');
  const calls = (thread.trace || []);
  for (const msg of (thread.messages || [])) {
    if (msg.role === 'user') addBubble('user', '你', esc(msg.content));
    else if (msg.role === 'assistant') addBubble('bot', 'A', esc(msg.content));
  }
  if (calls.length) {
    const lines = calls.map((c) => `${c.tool}(${JSON.stringify(c.args)}) → ${c.ok ? 'OK' : '失败: ' + (c.error || '')}`).join('\n');
    addBubble('sys', 'i', '这条对话用过的工具：\n' + esc(lines));
  }
  renderCalls(calls);
  await loadThreads();
  await refreshState();
}

/* ---------------- 中间：对话 ---------------- */
function addBubble(kind, who, html, extra) {
  const el = document.createElement('div');
  el.className = 'msg ' + kind;
  el.innerHTML = `<div class="av">${who}</div><div class="bub">${html}${extra ? `<div class="tool">${esc(extra)}</div>` : ''}</div>`;
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
  return el;
}
function sysNote(text) { return addBubble('sys', 'i', esc(text)); }

let thinkingEl = null;
function showThinking(text) {
  hideThinking();
  thinkingEl = document.createElement('div');
  thinkingEl.className = 'msg sys';
  thinkingEl.innerHTML = `<div class="av">A</div><div class="bub thinking"><span class="dot"></span>${esc(text)}</div>`;
  $('log').appendChild(thinkingEl);
  $('log').scrollTop = $('log').scrollHeight;
}
function hideThinking() { if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; } }

async function send() {
  const text = $('input').value.trim();
  if (!text) return;
  if (busy) { sysNote('上一条还在处理中，稍等。'); return; }
  busy = true; $('send').disabled = true;
  $('input').value = '';
  addBubble('user', '你', esc(text));
  showThinking('模型正在理解并决定调哪个工具…');
  try {
    const data = await api('/api/chat', {
      method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({ workspace, thread_id: threadId, text }),
    });
    hideThinking();
    threadId = data.thread_id;
    if (data.session_id) viewSession = data.session_id;   // 这一轮用到的仿真实例
    await syncViewSession();                              // 以服务端为准对齐一次
    if (data.reply) addBubble('bot', 'A', esc(data.reply));
    else addBubble('bot', 'A', '<span style="color:var(--muted)">（模型没有给出文字回复）</span>');
    if (data.tool_calls?.length) {
      const lines = data.tool_calls.map((c) =>
        `${c.tool}(${JSON.stringify(c.args)}) ${c.ok ? '✓' : '✗ ' + (c.error || '')}  ${c.elapsed_s}s`).join('\n');
      addBubble('sys', 'i', '本步工具调用：\n' + esc(lines));
    }
    renderCalls(data.tool_calls || [], true);
    await loadThreads(); await refreshState();
    const u = data.usage || {};
    if (u.prompt_tokens) $('pModel').textContent = `${$('pModel').dataset.m || ''} · ${u.prompt_tokens}+${u.completion_tokens} tok`;
  } catch (e) {
    hideThinking();
    addBubble('err', '!', '这一轮失败了：' + esc(e.message));
  } finally {
    busy = false; $('send').disabled = false; $('input').focus();
  }
}

/* ---------------- 右侧：可视化（轮询） ---------------- */
function worldToMapOverlay(s) { return s.overlay || {}; }

function renderMap(s) {
  const mp = s.map || {}, size = mp.map_size || [0, 0];
  $('map').src = `${NAVLIVE}/map.png?session=${s.session_id}&t=${Math.round((s.map_ts||0)*5)/5}`;
  if (!size[0]) return;
  const svg = $('ov');
  svg.setAttribute('viewBox', `0 0 ${size[0]} ${size[1]}`);
  const ov = worldToMapOverlay(s);
  const trail = (ov.trail_px||[]).map((p)=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const marks = (ov.landmarks_px||[]).map((m)=>{
    const [c,r]=m.px;
    return `<g><rect x="${(c-4).toFixed(1)}" y="${(r-4).toFixed(1)}" width="8" height="8" rx="1.5"
      fill="#4c8dff" stroke="#fff" stroke-width="1.2"/>
      <text x="${(c+7).toFixed(1)}" y="${(r+4).toFixed(1)}" fill="#8fbaff" font-size="19" font-weight="600">${esc(m.name)}</text></g>`;
  }).join('');
  const goal = ov.goal_px?`<circle cx="${ov.goal_px[0].toFixed(1)}" cy="${ov.goal_px[1].toFixed(1)}" r="8" fill="#22c55e" stroke="#fff" stroke-width="2"/>`:'';
  const tgt = ov.target_px?`<rect x="${(ov.target_px[0]-6).toFixed(1)}" y="${(ov.target_px[1]-6).toFixed(1)}" width="12" height="12"
      transform="rotate(45 ${ov.target_px[0].toFixed(1)} ${ov.target_px[1].toFixed(1)})"
      fill="none" stroke="#f0a020" stroke-width="2.5"/>`:'';
  const ap = mp.agent_px;
  const robot = ap?`<g><circle cx="${ap[0].toFixed(1)}" cy="${ap[1].toFixed(1)}" r="9" fill="#f0780a" stroke="#3a1c00" stroke-width="2.5"/>
      <circle cx="${ap[0].toFixed(1)}" cy="${ap[1].toFixed(1)}" r="2.5" fill="#fff"/></g>`:'';
  svg.innerHTML = [trail?`<polyline points="${trail}" fill="none" stroke="#e85a14" stroke-width="3.5"
      stroke-linejoin="round" stroke-linecap="round"/>`:'', marks, goal, tgt, robot].join('');
}

function renderTele(s) {
  const m = s.metrics||{}, pos = (s.pose||{}).position||[];
  const st = m.success===1?'成功':(s.episode_finished?'已结束':(s.paused?'已暂停':'进行中'));
  const rows = [
    ['场景', s.scene_id || '—'],
    ['任务', '#' + (s.episode_id ?? '—')],
    ['指令', String(s.instruction||'').trim().slice(0,60) || '—'],
    ['当前目标', s.target_label || '—'],
    ['位置 (x, z)', `${fmt(pos[0])}, ${fmt(pos[2])}`],
    ['剩余距离', `${fmt(m.distance_to_goal)} m`],
    ['已走步数', s.step_count ?? '—'],
    ['碰撞', m.collisions ?? '—'],
    ['回合', st],
  ];
  $('tele').innerHTML = rows.map(([k,v]) => `<div class="k">${esc(k)}</div><div class="v" title="${esc(v)}">${esc(v)}</div>`).join('');
  $('pScene').textContent = `${s.scene_id || '—'} · 任务 #${s.episode_id ?? '—'}`;
  $('pStep').textContent = `第 ${s.step_count ?? 0} 步 · ${st}`;
  $('pStep').className = 'pill ' + (st==='进行中'?'ok':(st==='成功'?'info':'warn'));
}

function renderCalls(calls, append) {
  const box = $('calls');
  if (!append) { box.innerHTML = calls.length ? '' : '<div class="empty">还没调用过工具。</div>'; }
  if (!calls.length) return;
  if (box.querySelector('.empty')) box.innerHTML = '';
  for (const c of calls) {
    const row = document.createElement('div');
    row.className = 'callrow';
    row.innerHTML = `<span class="${c.ok?'ok':'no'}">${c.ok?'✓':'✗'}</span> <b>${esc(c.tool)}</b>(${esc(JSON.stringify(c.args))}) ` +
      `<span style="color:var(--muted)">${c.elapsed_s ?? ''}s</span>`;
    box.prepend(row);
  }
  $('vCalls').textContent = box.children.length;
}

const KIND = {session_opened:'打开任务',plan_changed:'改派',waypoint_reached:'到达航点',arrived:'到达终点',
  episode_over:'回合结束',episode_restarted:'重开本轮',paused:'暂停',resumed:'恢复',
  planner_error:'规划失败',stalled:'卡住',note:'备注',session_closed:'关闭任务'};

function renderEvents(list) {
  for (const e of list) {
    const li = document.createElement('li');
    const d = (e.payload && (e.payload.label || e.payload.reason || e.payload.note)) || '';
    li.innerHTML = `<span class="ek">${esc(KIND[e.kind] || e.kind)}</span><span class="ed">${esc(d)}</span>`;
    $('ev').prepend(li);
  }
  while ($('ev').children.length > 40) $('ev').lastChild.remove();
}

/** 从服务端读回这条对话的**当前会话**并切右侧。
 *  为什么必须每次同步：模型在对话里调 `nav_open` 换场景时，会话 id 是服务端更新的，
 *  前端如果只在 send 里更新 `viewSession`，就会出现"新对话的右侧还指着上一条对话的场景"
 *  （实测踩到）。所以每次轮询都对齐一次。 */
async function syncViewSession() {
  if (!threadId) return;
  try {
    const t = await api('/api/thread?workspace=' + encodeURIComponent(workspace) + '&thread_id=' + encodeURIComponent(threadId));
    const sid = (t.context || {}).session_id || null;
    if (sid !== viewSession) {
      viewSession = sid;
      lastSeq = 0; $('ev').innerHTML = '';
      const sc = (t.context || {}).scene_id;
      $('vThread').textContent = (t.title || '对话') + (sc ? ' · ' + sc : ' · 未开场景');
    }
  } catch { /* 读不到就沿用旧的 */ }
}

async function refreshState() {
  try {
    // 一次请求拿全：状态 + 画面/地图版本号。**带上 viewSession**，
    // 服务端会把仿真焦点切到这条对话的会话 —— 所以"切对话 = 右侧跟着切"。
    const q = viewSession ? '?session=' + encodeURIComponent(viewSession) : '';
    const payload = await fetch(NAVLIVE + '/view' + q, { cache: 'no-store' }).then((r) => r.json());
    const s = payload.state || {};
    viewSession = payload.session_id || viewSession;
    // 顶栏场景徽标用**响应里会话自身的**字段，而不是快照里的 ——
    // 焦点切换在后台做，快照会短暂滞后一条，直接读快照会看到"场景还没换过来"。
    const sceneNow = payload.scene_id || s.scene_id;
    const epNow = payload.episode_id ?? s.episode_id;
    $('pAgent').textContent = payload.activating ? '正在切换会话…' : 'agent 在线';
    $('pAgent').className = 'pill ' + (payload.activating ? 'warn' : 'ok');
    const age = Date.now()/1000 - (s.frame_ts || 0);
    $('vAge').textContent = age < 2 ? '实时' : age.toFixed(0) + 's 前';
    const stamp = Math.round((s.frame_ts||0) * 5) / 5;
    $('frame').src = `${NAVLIVE}/frame.jpg?session=${viewSession}&t=${stamp}`;
    $('map').src = `${NAVLIVE}/map.png?session=${viewSession}&t=${Math.round((s.map_ts||0)*5)/5}`;
    const cal = (s.overlay||{}).calibration;
    $('vCal').textContent = cal ? `标定 ${fmt(cal.scale_x,0)}/${fmt(cal.scale_z,0)} px/m` : '未标定';
    const fresh = (s.events_tail||[]).filter((e) => e.seq > lastSeq);
    if (fresh.length) { lastSeq = fresh[fresh.length-1].seq; renderEvents(fresh); }
    renderTele(sceneNow ? Object.assign({}, s, { scene_id: sceneNow, episode_id: epNow }) : s);
    renderMap(s);
  } catch (e) {
    // 会话可能已经失效（服务重启过）。这时**不要**显示别人的场景，明确提示。
    const gone = /已不存在|404/.test(String(e.message));
    $('pAgent').textContent = gone ? '这条对话的会话已失效' : (viewSession ? 'navlive 未连接' : '这个对话还没开场景');
    $('pAgent').className = 'pill warn';
    if (gone) {
      $('vThread').textContent = '会话已失效 · 在这条对话里重新说一次「载入场景 …」';
      $('frame').removeAttribute('src');
      $('map').removeAttribute('src');
      $('ov').innerHTML = '';
      $('tele').innerHTML = '<div class="k">提示</div><div class="v">重新载入场景即可</div>';
    }
  }
}

async function pollAgent() {
  try {
    const { events } = await api('/api/stream?since=' + lastSeqAgent);
    for (const ev of events) {
      lastSeqAgent = ev.seq;
      // 工具行**只由 /api/chat 的返回渲染**。
      // 这里再渲染一次会出现重复行（而且流事件里没有完整 args）——踩过。
      if (ev.kind === 'thinking' && busy) showThinking(`模型第 ${ev.round} 轮推理中…`);
      if (ev.kind === 'tool_start' && busy && ev.thread_id === threadId) {
        showThinking(`正在调用 ${ev.tool} …`);
      }
    }
  } catch { /* agent 短暂不可用不打扰用户 */ }
}

/* ---------------- 启动 ---------------- */
let lastSeqAgent = 0;

$('send').onclick = send;
// 点地图看整张大图（右侧栏窄，细节看不清时用）
$('map').onclick = () => {
  const src = $('map').src;
  if (src) window.open(src, '_blank', 'noopener');
};
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
});
$('btnNew').onclick = () => newThread();

(async function boot() {
  try {
    const h = await api('/health');
    $('pModel').dataset.m = h.model;
    $('pModel').textContent = h.model;
  } catch (e) { $('pAgent').textContent = 'agent 未连接'; $('pAgent').className = 'pill warn'; }
  try { await loadWorkspaces(); await loadThreads(); } catch (e) { sysNote('加载工作区失败：' + e.message); }
  if (!threadId) {
    try {
      const t = await api('/api/threads', { method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({ workspace }) });
      threadId = t.thread_id;
      sysNote('这是 Agnes 的导航 Agent。左边是工作区与历史对话，右边实时显示机器人的画面与位置。\n说一句话就行，例如「带客人去客厅沙发」。');
      await loadThreads();
    } catch (e) { sysNote('创建对话失败：' + e.message); }
  }
  // 快捷指令
  const QUICK = ['它现在在哪？', '带客人去沙发', '先去厨房再回卧室', '停一下', '继续走', '重开本轮'];
  $('quick').innerHTML = QUICK.map((q) => `<span class="chip" data-q="${esc(q)}">${esc(q)}</span>`).join('');
  [...$('quick').querySelectorAll('.chip')].forEach((c) => {
    c.onclick = () => { $('input').value = c.dataset.q; send(); };
  });
  await refreshState();
  setInterval(async () => { await syncViewSession(); await refreshState(); }, 900);
  setInterval(pollAgent, 800);
})();
</script>
</body>
</html>
